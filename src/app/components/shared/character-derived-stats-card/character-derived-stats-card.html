<div class="derived-stats-container">
  <h2 class="section-title">Derived Stats</h2>
  <div class="derived-stats-bar">
    <div class="stat-item">
      <span class="stat-label">Movement Speed</span>
      <span class="stat-value">{{ getMovementSpeed() }}</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Recovery Die</span>
      <span class="stat-value">{{ getRecoveryDie() }}</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Senses Range</span>
      <span class="stat-value">{{ getSensesRange() }}</span>
    </div>
  </div>
  <div class="derived-stats-bar">
    <div class="stat-item">
      <span class="stat-label">Lifting Capacity</span>
      <span class="stat-value">{{ getLiftingCapacity() }}</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Carrying Capacity</span>
      <span class="stat-value">{{ getCarryingCapacity() }}</span>
    </div>
  </div>
</div>
